name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build, test, lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash -n packaging/install.sh
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  windows-check:
    # A real `cargo build`/`test` needs the Npcap SDK's import library (pcap links against it even
    # to produce a binary, not only to capture) -- see WINDOWS.md. Until that is resolved, this
    # catches the far more common way Windows portability breaks: a change that plainly does not
    # type-check or lint for that target, the way src/net.rs did before this job was added.
    name: type-check and lint for Windows (no capture yet, see WINDOWS.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo check --locked --target x86_64-pc-windows-gnu --all-targets
      - run: cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets -- -D warnings

  smoke:
    name: the console in a real browser
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --locked
      - run: node tools/ui-smoke.mjs
        env:
          CHROME: /usr/bin/google-chrome

  docker:
    name: Docker image builds and the demo container answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build demo
      - name: run the demo service and wait for it to answer
        run: |
          docker compose up -d demo
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/api/health && break
            sleep 2
          done
          curl -fs http://127.0.0.1:8080/api/health
      - name: the login page itself loads (not just /api/health)
        run: curl -fs http://127.0.0.1:8080/ | grep -q "DENIS"
      - if: always()
        run: docker compose logs demo

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071 ("Marvin Attack"): a timing side-channel in the `rsa` crate's
          # *private-key* operations (decryption/signing). `rsa` reaches this project only
          # transitively through `openidconnect`/`oauth2` (SSO), which uses it solely to verify
          # an identity provider's ID token signature with its *public* key — DENIS never holds
          # or uses an RSA private key here, so this specific advisory does not apply to how the
          # crate is actually used. No patched version exists upstream to update to either way.
          ignore: RUSTSEC-2023-0071
