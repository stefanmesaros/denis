name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build, test, lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash -n packaging/install.sh
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  smoke:
    name: the console in a real browser
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --locked
      - run: node tools/ui-smoke.mjs
        env:
          CHROME: /usr/bin/google-chrome

  docker:
    name: Docker image builds and the demo container answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build demo
      - name: run the demo service and wait for it to answer
        run: |
          docker compose up -d demo
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/api/health && break
            sleep 2
          done
          curl -fs http://127.0.0.1:8080/api/health
      - name: the login page itself loads (not just /api/health)
        run: curl -fs http://127.0.0.1:8080/ | grep -q "DENIS"
      - if: always()
        run: docker compose logs demo

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
