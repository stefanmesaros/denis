[package]
name = "denis"
version = "1.6.0"
edition = "2021"
description = "DENIS: Device Enumeration & Network Inventory Security. Find every device on an IT or OT network, keep an editable asset register, and get alerted when behaviour changes."
license-file = "LICENSE"
authors = ["Stefan Mesaros"]
repository = "https://github.com/stefanmesaros/denis"
homepage = "https://github.com/stefanmesaros/denis"
readme = "README.md"
keywords = ["network", "asset-inventory", "security", "ot", "anomaly-detection"]
categories = ["network-programming", "command-line-utilities"]
# not meant for crates.io: it is an application
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
ipnet = "2.12.2"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
libc = "0.2.189"
mime_guess = "2.0.5"
nix = { version = "0.31.3", features = ["hostname", "net"] }
oui-data = "0.2.3"
pcap = "2.5.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
socket2 = "0.6.5"
surge-ping = "0.9.1"
time = "0.3"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.2", features = ["json"] }
x509-parser = { version = "0.18.1", features = ["verify"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# Password hashing is deliberately expensive; optimise it even in debug builds so tests stay quick.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
